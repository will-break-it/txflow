name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Also fails when schema/v<N>/ is stale.
      - run: cargo test --workspace
      # The browser build of the spec check.
      - run: cargo build --release --target wasm32-unknown-unknown -p txflow-wasm

  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
      - run: npm test

  # Commits, branch names and PR titles carry no co-author or session
  # trailers, no "generated by" lines, no emojis, and none of the words in the
  # repository variable BLOCKED_TERMS (a regex, matched case-insensitively).
  authorship:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commits, branch and title
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BLOCKED: ${{ vars.BLOCKED_TERMS }}
        run: |
          log=$(git log --format='%an <%ae> / %cn <%ce>%n%B' "$BASE..$HEAD")
          all=$(printf '%s\n%s\n%s\n' "$BRANCH" "$TITLE" "$log")
          bad=$(printf '%s\n' "$all" | grep -inE "${BLOCKED:+$BLOCKED|}co-authored-by|^[a-z-]+-session:|generated (by|with)" || true)
          emoji=$(printf '%s\n' "$all" | LC_ALL=C.UTF-8 grep -nP '[\x{1F000}-\x{1FAFF}\x{2600}-\x{27BF}]' || true)
          if [ -n "$bad$emoji" ]; then
            echo "::error::Branch, title or commits carry a blocked term, a trailer or an emoji:"
            printf '%s\n%s\n' "$bad" "$emoji"
            exit 1
          fi
